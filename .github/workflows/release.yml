name: Release pod-initrd
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. v0.2.1)"
        required: true

permissions:
  contents: read
  packages: write

# Publishes a 4-arch OCI artifact at
# ghcr.io/openweft/weft-microvm-pod-initrd:<tag> using ORAS, with the
# openweft media-type convention :
#
#   artifactType : application/vnd.openweft.microvm.pod-initrd
#   layer        : application/vnd.openweft.microvm.pod-initrd.cpio.gz
#
# This mirrors the openweft/weft-microvm-kernel pattern (kernel /
# kernel.image / kernel.config). The puller is `weft microvm
# pull-pod-initrd`, sibling of `weft microvm pull-kernel`.
#
# Multi-arch is expressed as an OCI index : one per-arch manifest
# pointing at its own cpio.gz layer, plus a top-level index with
# platform descriptors so `oras pull ref` Just-Works on any host.

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - name: Setup go-task
        run: go install github.com/go-task/task/v3/cmd/task@latest

      - name: Install pkgx (zig-build.sh uses `pkgx bash` + `pkgx zig`)
        run: |
          curl -fsSL https://pkgx.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build static crun for 4 archs (zig, no container, no upstream loong64 prebuilt)
        run: $(go env GOPATH)/bin/task build-crun

      - name: Cross-build weft-init for 4 archs
        run: |
          set -euo pipefail
          mkdir -p bin
          for arch in amd64 arm64 riscv64 loong64; do
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build \
              -trimpath -ldflags='-s -w' \
              -o bin/weft-init-linux-$arch ./cmd/weft-init
          done

      - name: Install pod-init-build (standalone cpio assembler)
        run: go install ./cmd/pod-init-build

      - name: Build 4-arch pod-initrd cpio.gz
        run: |
          set -euo pipefail
          mkdir -p out
          for arch in amd64 arm64 riscv64 loong64; do
            $(go env GOPATH)/bin/pod-init-build \
              --init bin/weft-init-linux-$arch \
              --crun crun-build/dist/crun.linux.$arch \
              -o out/pod-initrd-$arch.cpio.gz
            ls -la out/pod-initrd-$arch.cpio.gz
          done

      - name: Setup ORAS
        uses: oras-project/setup-oras@v1

      - name: Login to GHCR (oras)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Push 4 per-arch manifests via ORAS
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          REPO=ghcr.io/openweft/weft-microvm-pod-initrd
          ART=application/vnd.openweft.microvm.pod-initrd
          LAYER=application/vnd.openweft.microvm.pod-initrd.cpio.gz
          # Push one artifact per arch with a platform-suffixed tag.
          # Then assemble a multi-arch OCI index pointing at all 4.
          for arch in amd64 arm64 riscv64 loong64; do
            oras push --artifact-type "$ART" \
              --artifact-platform linux/$arch \
              "$REPO:${TAG}-${arch}" \
              "out/pod-initrd-$arch.cpio.gz:$LAYER" \
              --annotation "org.opencontainers.image.title=pod-initrd" \
              --annotation "org.opencontainers.image.description=openweft pod-mode initramfs (weft-init + crun)" \
              --annotation "org.opencontainers.image.source=https://github.com/openweft/weft-microvm-init"
          done
          # Index : positional child tags only ; oras reads each child's
          # --artifact-platform annotation (set above) to populate the
          # index's platform descriptors. The old workflow tried to pass
          # --platform flags interleaved with tags, which oras 1.3+
          # rejects as unknown flags.
          oras manifest index create "$REPO:${TAG}" \
            "${TAG}-amd64" "${TAG}-arm64" "${TAG}-riscv64" "${TAG}-loong64"
          # Move :latest to point at the new index.
          oras tag "$REPO:${TAG}" latest
