name: integration-linux

# Runs the //go:build linux && integration tests for the in-VM
# firewall reconciler : they program real nftables tables via
# netlink (CAP_NET_ADMIN required) inside a fresh network namespace
# so the kernel state never leaks onto the runner. Push + PR scope
# only — no publishing, no tag gating.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  firewall:
    name: pkg/network firewall netlink integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: kernel info
        run: |
          uname -a
          which nft || true
          nft --version || true

      - name: go mod download
        env:
          GOWORK: off
        run: go mod download

      - name: go test (integration)
        env:
          GOWORK: off
        # sudo -E preserves env so the inner `go` resolves through
        # PATH and caches stay in the runner's home. ubuntu-latest
        # grants CAP_NET_ADMIN via sudo without any extra setup.
        run: |
          sudo -E env "PATH=$PATH" go test -tags=integration -v -count=1 ./pkg/network/
